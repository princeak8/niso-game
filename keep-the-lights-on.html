 demand is volatile and weather-dependent; dispatchers must constantly forecast and track instantaneous system load.`,category:`Demand`,isPredefined:!0},{id:`lines-work`,idealAssumption:`Every transmission line works without tripping`,realWorldReality:`Overhead lines trip from vegetation contact, line faults, lightning, insulator flashovers, and thermal overload (e.g., 330kV lines).`,category:`Transmission`,isPredefined:!0},{id:`discos-take-power`,idealAssumption:`Every DisCo takes exactly the power allocated to it`,realWorldReality:`DisCos frequently reject load due to feeder faults, rainstorms, or commercial reasons, causing frequency to spike dangerously.`,category:`DisCos`,isPredefined:!0},{id:`dispatcher-sees-all`,idealAssumption:`Dispatcher sees everything at once with 100% clarity`,realWorldReality:`SCADA telemetry gaps, fiber/radio communication outages, and RTU failures mean dispatchers must make voice calls to sub-stations.`,category:`SCADA`,isPredefined:!0}],gf=[{icon:`⚡`,title:`50.00 Hz Target Frequency`,gameConcept:`Keep generation = demand to keep frequency needle at 50 Hz.`,nccReality:`NCC Osogbo monitors the frequency meter continuously. If frequency drifts below 48.8 Hz, automated Under-Frequency Load Shedding (UFLS) triggers in stages to prevent total system collapse.`},{icon:`🌊`,title:`Spinning Reserves (Kainji Hydro)`,gameConcept:`Keep 2 empty slots on Kainji for quick backup.`,nccReality:`Kainji and Jebba hydro stations are vital black-start and primary governor response providers on the Nigerian grid, maintaining frequency stability when thermal units trip.`},{icon:`🔥`,title:`Slow Gas Ramp (Egbin & Geregu)`,gameConcept:`Gas stations can only move 3 tokens per round.`,nccReality:`Heavy-duty industrial gas turbines at Egbin and Geregu require controlled acceleration and thermal soaking. Dispatchers at NCC must send dispatch instructions 30-60 minutes in advance.`},{icon:`🔌`,title:`Load Shedding as Last Resort`,gameConcept:`Cut 1-3 tokens of deman
